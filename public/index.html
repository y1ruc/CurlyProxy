<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">CurlyProxy</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" id="page-favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%238b5cf6' d='M4 12c0-2.5 1.5-4 4-4 1.5 0 2.8.6 4 1.5 1.2-.9 2.5-1.5 4-1.5 2.5 0 4 1.5 4 4s-1.5 4-4 4h-8c-2.5 0-4-1.5-4-4z'/%3E%3C/svg%3E">
</head>
<body>

<div class="mask-overlay" id="mask-overlay">
    <div class="mask-panel">
        <h2>CurlyProxy</h2>
        <p>Pick what to show in your tab bar so nobody notices.</p>
        <div class="mask-grid" id="mask-grid"></div>
    </div>
</div>

<div class="browser" id="browser">
    <div class="toolbar">
        <div class="nav-btns">
            <button id="nav-back" title="Back">
                <svg viewBox="0 0 24 24" width="16" height="16"><polyline points="15 18 9 12 15 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="nav-fwd" title="Forward">
                <svg viewBox="0 0 24 24" width="16" height="16"><polyline points="9 18 15 12 9 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="nav-refresh" title="Refresh">
                <svg viewBox="0 0 24 24" width="16" height="16"><polyline points="23 4 23 10 17 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>
        <div class="url-bar" id="url-bar">
            <svg viewBox="0 0 24 24" width="14" height="14" class="url-icon"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><line x1="15" y1="15" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input type="text" id="url-input" placeholder="Search or enter URL" autocomplete="off" spellcheck="false">
        </div>
        <button id="go-btn">Go</button>
    </div>

    <div class="tab-bar" id="tab-bar">
        <div class="tab-list" id="tab-list"></div>
        <button id="add-tab" title="New Tab">+</button>
    </div>

    <main class="content" id="content">
        <div class="welcome" id="welcome-screen">
            <svg viewBox="0 0 40 40" width="36" height="36"><path d="M6 20c0-4.5 2.5-7 6-7 2.5 0 4.5 1 6 2.5 2-1.5 3.5-2.5 6-2.5 3.5 0 6 2.5 6 7s-2.5 7-6 7H12c-3.5 0-6-2.5-6-7z" fill="url(#wl)"/><defs><linearGradient id="wl" x1="6" y1="13" x2="34" y2="27"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs></svg>
            <h2>CurlyProxy</h2>
            <p>Type a URL in the bar above to get started.</p>
        </div>
        <iframe id="proxy-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-pointer-lock allow-top-navigation allow-presentation" style="display:none"></iframe>
    </main>

    <div class="browser-foot">
        <button id="games-toggle">
            <svg viewBox="0 0 24 24" width="14" height="14"><rect x="3" y="3" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <span>Games</span>
        </button>
        <button id="socials-toggle">
            <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="18" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="3" fill="none" stroke="currentColor" stroke-width="2"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49" fill="none" stroke="currentColor" stroke-width="2"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <span>Socials</span>
        </button>
        <button id="cloak-btn" title="Change mask">
            <svg viewBox="0 0 24 24" width="14" height="14"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <span id="cloak-label">Mask</span>
        </button>
        <button id="fullscreen-btn" title="Fullscreen">
            <svg viewBox="0 0 24 24" width="14" height="14"><polyline points="15 3 21 3 21 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="9 21 3 21 3 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="21" y1="3" x2="14" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="21" x2="10" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
    </div>
</div>

<div class="games-overlay" id="games-overlay">
    <div class="games-overlay-backdrop" id="games-backdrop"></div>
    <div class="games-panel">
        <div class="games-header">
            <h3>Game Library</h3>
            <button id="games-close">
                <svg viewBox="0 0 24 24" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
        </div>
        <div class="games-grid" id="games-grid"></div>
    </div>
</div>

<div class="overlay" id="socials-overlay">
    <div class="overlay-backdrop" id="socials-backdrop"></div>
    <div class="overlay-panel">
        <div class="overlay-header">
            <h3>Socials</h3>
            <button id="socials-close">
                <svg viewBox="0 0 24 24" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
        </div>
        <div class="overlay-grid" id="socials-grid"></div>
    </div>
</div>

<script src="/js/script.js"></script>
</body>
</html>
